name: Sync fork

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/ecmwf/WeatherGenerator"
          source_branch: "tjh/dev/dashboard"
          destination_branch: "tjh/dev/dashboard"
          github_token: ${{ secrets.GITHUB_TOKEN }}
